<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<title>🚐 متابعة العربية</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--bg:#f3f5f8;--card:#fff;--ink:#1c2733;--muted:#6b7785;--line:#dfe4ea;--pri:#0f6fd8;--ok:#1e8449;--warn:#b9770e;--err:#c0392b;--nav:#0f2a44}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
  header{background:var(--nav);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1000}
  header b{font-size:17px;flex:1}
  header .dot{width:12px;height:12px;border-radius:50%;background:#888;flex:none}
  .wrap{max-width:640px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .muted{color:var(--muted);font-size:13px;line-height:1.7}
  .btn{border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:700;cursor:pointer;background:#e8edf3;color:var(--ink);font-family:inherit}
  .btn.big{width:100%;padding:18px;font-size:20px}
  .btn.pri{background:var(--pri);color:#fff}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.err{background:var(--err);color:#fff}
  .btn.sm{padding:8px 10px;font-size:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  #map,#vmap{height:42vh;min-height:260px;border-radius:14px;border:1px solid var(--line)}
  .banner{border-radius:12px;padding:12px;font-weight:700;display:none;line-height:1.6}
  .banner.show{display:block}
  .banner.err{background:#fdecea;color:var(--err);border:2px solid var(--err)}
  .banner.warn{background:#fef5e7;color:var(--warn);border:1px solid var(--warn)}
  .banner.ok{background:#e9f7ef;color:var(--ok);border:1px solid var(--ok)}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .stat{background:#f6f8fb;border-radius:10px;padding:8px;font-size:13px}
  .stat b{display:block;font-size:16px}
  .next{border:2px solid var(--pri)}
  .next h3{margin:0 0 6px;font-size:15px;color:var(--muted)}
  .next .nm{font-size:22px;font-weight:800}
  .stop{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .stop:last-child{border-bottom:0}
  .stop .n{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .stop.done .n{background:#9aa5b1}
  .stop.done .nm{text-decoration:line-through;color:var(--muted)}
  .stop.cur{background:#eef5ff;border-radius:10px;padding:8px 6px}
  .stop .nm{flex:1;font-weight:700}
  .pin{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);font-size:13px}
  .bus{font-size:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));transition:opacity .3s}
  .bus.faded{opacity:.4}
  .ltr{direction:ltr;unicode-bidi:embed}
  input.link{width:100%;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;direction:ltr}
  .dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:3000;padding:16px}
  .dlg .card{max-width:420px;width:100%}
  .hide{display:none!important}
</style>
</head>
<body>
<header><span class="dot" id="hdot"></span><b id="htitle">🚐 متابعة العربية</b><span id="hclock" class="ltr" style="font-size:13px;opacity:.8"></span></header>
<div class="wrap" id="app"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// =====================================================================
// صفحة متابعة العربيات — نسخة 1.0 (المرحلة ٢)
// فيها ٣ أوضاع حسب اللينك:
//   #k=المفتاح      ← صفحة السواق: بتبعت مكان العربية لـ Firebase
//   #view=المفتاح   ← صفحة متابعة تجريبية: بتعرض العربية على الخريطة لحظة بلحظة
//   من غير حاجة     ← وضع التجربة: بيعمل مفتاح جديد ويديك اللينكين
// المفتاح بيتكتب بعد # في اللينك، وده معناه إنه مش بيتبعت لأي سيرفر غير Firebase نفسه
// =====================================================================
const DB = 'https://shuttle-tracking-10672-default-rtdb.europe-west1.firebasedatabase.app';
const SEND_EVERY = 10000;   // نبعت المكان كل ١٠ ثواني
const SEND_MOVE = 30;       // أو أول ما العربية تتحرك ٣٠ متر (بس مش أسرع من كل ٣ ثواني)
const GPS_STALE = 30000;    // لو الـ GPS ما جابش مكان جديد ٣٠ ثانية = تنبيه
const Q_MAX = 3000;         // أقصى عدد نقط بنحفظها لما النت يقطع

const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hashArg = n => { const m = location.hash.match(new RegExp('[#&]' + n + '=([A-Za-z0-9]+)')); return m ? m[1] : null; };
const fmtAge = ms => { if (ms < 0) ms = 0; const s = Math.round(ms / 1000); if (s < 60) return s + ' ث'; const m = Math.floor(s / 60); if (m < 60) return m + ' د'; return Math.floor(m / 60) + ' س ' + (m % 60) + ' د'; };
const fmtTime = t => new Date(t).toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
const distM = (a, b) => { const R = 6371000, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng); const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
setInterval(() => { $('hclock').textContent = new Date().toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }); }, 1000);

// ---------- Firebase (من غير مكتبات: طلبات عادية على الرابط) ----------
const fbUrl = (k, path) => `${DB}/trk/${k}${path ? '/' + path : ''}.json`;
async function fb(method, k, path, body, keepalive) {
  const r = await fetch(fbUrl(k, path), { method, body: body === undefined ? undefined : JSON.stringify(body), keepalive: !!keepalive, headers: body === undefined ? undefined : { 'Content-Type': 'application/json' } });
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
const SV = { '.sv': 'timestamp' }; // وقت السيرفر

// مفتاح عشوائي ٣٢ حرف (مستحيل يتخمّن)
function newKey() {
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', b = new Uint8Array(32);
  crypto.getRandomValues(b); return Array.from(b, x => A[x % A.length]).join('');
}

// ---------- الخريطة: قمر صناعي + أسماء الطرق والمناطق ----------
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
function makeMap(el) {
  const m = L.map(el, { zoomControl: true, attributionControl: false });
  const sat = L.layerGroup([
    L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
    L.tileLayer(ESRI + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
    L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
  ]).addTo(m);
  const streets = L.tileLayer(ESRI + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
  L.control.layers({ '🛰️ قمر صناعي + أسماء': sat, 'شوارع': streets }, null, { position: 'topleft' }).addTo(m);
  m.setView([30.0444, 31.2357], 11);
  return m;
}
const busIcon = faded => L.divIcon({ html: `<div class="bus${faded ? ' faded' : ''}">🚐</div>`, className: '', iconSize: [34, 34], iconAnchor: [17, 17] });
const numIcon = (n, col) => L.divIcon({ html: `<div class="pin" style="background:${col}">${n}</div>`, className: '', iconSize: [28, 28], iconAnchor: [14, 14] });

// ---------- صوت تنبيه واهتزاز ----------
let AC = null;
function beep(times) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < (times || 3); i++) {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.35;
      o.frequency.value = 880; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.start(t); o.stop(t + 0.3);
    }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
}

// =====================================================================
// وضع السواق (#k=المفتاح)
// =====================================================================
function driverMode(k) {
  const RUN_KEY = 'trk_run_' + k, Q_KEY = 'trk_q_' + k;
  let plan = null, done = {}, running = false, watchId = null, lastFix = null, lastFixAt = 0, lastSent = null, lastSentAt = 0, lastOkAt = 0;
  let wake = null, swReg = null, staleWarnAt = 0, routeFor = null, routeAt = 0, follow = true, battery = null;
  let queue = ls.get(Q_KEY, []);

  app.innerHTML = `
    <div class="banner err" id="bErr"></div>
    <div class="banner warn" id="bWarn"></div>
    <div class="card" id="cIntro">
      <div style="font-size:18px;font-weight:800" id="lineName">⏳ بجيب بيانات الخط...</div>
      <div class="muted" id="lineSub"></div>
    </div>
    <button class="btn big pri" id="bStart">▶️ ابدأ الرحلة</button>
    <div class="card next hide" id="cNext"></div>
    <div id="map"></div>
    <div class="card hide" id="cStops"><b>الركاب</b><div id="stops"></div></div>
    <div class="card hide" id="cStat">
      <div class="stats" id="stats"></div>
      <div class="muted" style="margin-top:6px">⚠️ خلّي الصفحة دي مفتوحة طول الرحلة والموبايل على الشاحن. لو كلّمت حد أو فتحت أبلكيشن تاني، ارجع للصفحة دي على طول.</div>
    </div>
    <button class="btn big err hide" id="bEnd">⏹️ خلصت الرحلة</button>
    <div class="muted" style="text-align:center">متابعة العربية — نسخة 1.0</div>`;

  const map = makeMap($('map'));
  const stopLayer = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
  let busMk = null;
  map.on('dragstart', () => { follow = false; });

  const isPm = () => plan && plan.mode === 'pm';
  const nextIdx = () => plan && plan.stops ? plan.stops.findIndex((s, i) => !done[i]) : -1;
  const showB = (id, html) => { const b = $(id); b.innerHTML = html || ''; b.classList.toggle('show', !!html); };

  // ----- بيانات الخط (صفحتك هي اللي هتبعتها في المرحلة ٣) -----
  async function loadPlan() {
    try {
      const d = await fb('GET', k, '');
      plan = d && d.plan || null; done = d && d.done || {};
      ls.set('trk_plan_' + k, { plan, done });
    } catch (e) {
      const c = ls.get('trk_plan_' + k, null); if (c) { plan = c.plan; done = c.done || {}; }
      if (!navigator.onLine) showB('bWarn', '📵 مفيش نت دلوقتي — المتابعة هتشتغل وهتتبعت أول ما النت يرجع.');
    }
    drawPlan();
  }
  function drawPlan() {
    if (plan) {
      $('lineName').innerHTML = `🚐 ${esc(plan.line || 'الخط')} <span class="muted">(${isPm() ? 'انصراف' : 'حضور'})</span>`;
      $('lineSub').textContent = plan.stops && plan.stops.length ? `${plan.stops.length} راكب — الترتيب زي ما هو تحت.` : '';
      $('htitle').textContent = '🚐 ' + (plan.line || 'متابعة العربية');
    } else {
      $('lineName').textContent = '🚐 متابعة العربية';
      $('lineSub').textContent = 'لسه مفيش ركاب متبعتين للخط ده — تقدر تبدأ الرحلة والمتابعة هتشتغل عادي.';
    }
    stopLayer.clearLayers();
    const stops = plan && plan.stops || [], col = plan && plan.color || '#0f6fd8', b = [];
    stops.forEach((s, i) => { L.marker([s.lat, s.lng], { icon: numIcon(i + 1, done[i] ? '#9aa5b1' : col) }).bindTooltip(esc(s.n)).addTo(stopLayer); b.push([s.lat, s.lng]); });
    if (plan && plan.work) { L.marker([plan.work.lat, plan.work.lng], { icon: L.divIcon({ html: '<div style="font-size:26px">🏢</div>', className: '', iconSize: [30, 30], iconAnchor: [15, 15] }) }).bindTooltip('الشغل').addTo(stopLayer); b.push([plan.work.lat, plan.work.lng]); }
    if (b.length && !lastFix) map.fitBounds(b, { padding: [30, 30], maxZoom: 15 });
    $('cStops').classList.toggle('hide', !stops.length);
    $('stops').innerHTML = stops.map((s, i) => `<div class="stop${done[i] ? ' done' : ''}${i === nextIdx() ? ' cur' : ''}">
        <span class="n">${i + 1}</span><span class="nm">${esc(s.n)}</span>
        ${s.ph ? `<a class="btn sm" href="tel:${esc(s.ph)}">📞</a>` : ''}
        <button class="btn sm ${done[i] ? '' : 'ok'}" data-done="${i}">${done[i] ? '↩️' : (isPm() ? 'نزل ✓' : 'ركب ✓')}</button></div>`).join('');
    drawNext();
  }
  function drawNext() {
    const i = nextIdx(), c = $('cNext');
    if (!running || !plan || !plan.stops || !plan.stops.length) { c.classList.add('hide'); return; }
    c.classList.remove('hide');
    if (i < 0) { c.innerHTML = `<h3>كله ${isPm() ? 'نزل' : 'ركب'} ✓</h3><div class="nm">${isPm() ? 'خلصت التوصيل' : '🏢 على الشغل'}</div>`; drawRoute(); return; }
    const s = plan.stops[i], d = lastFix ? distM(lastFix, s) : null;
    c.innerHTML = `<h3>${isPm() ? 'اللي هينزل الجاي' : 'الراكب الجاي'} (${i + 1} من ${plan.stops.length})</h3>
      <div class="nm">${esc(s.n)}</div>
      <div class="muted" id="nextInfo">${d != null ? `على بعد ${d < 1000 ? Math.round(d) + ' متر' : (d / 1000).toFixed(1) + ' كم'} (خط مستقيم)` : ''}</div>
      <div class="row" style="margin-top:8px">${s.ph ? `<a class="btn pri grow" href="tel:${esc(s.ph)}" style="text-align:center;text-decoration:none">📞 كلّمه</a>` : ''}
      <button class="btn ok grow" data-done="${i}">${isPm() ? 'نزل ✓' : 'ركب ✓'}</button></div>`;
    drawRoute();
  }
  // الطريق من مكان العربية للراكب الجاي (بالطرق الحقيقية)
  async function drawRoute(force) {
    const i = nextIdx();
    const target = !plan ? null : i >= 0 ? plan.stops[i] : (!isPm() && plan.work ? plan.work : null);
    if (!lastFix || !target) { routeLayer.clearLayers(); return; }
    const key = i + '';
    if (!force && routeFor === key && Date.now() - routeAt < 90000) return;
    routeFor = key; routeAt = Date.now();
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${lastFix.lng},${lastFix.lat};${target.lng},${target.lat}?overview=full&geometries=geojson`);
      const j = await r.json(); const rt = j.routes && j.routes[0]; if (!rt) return;
      routeLayer.clearLayers();
      L.polyline(rt.geometry.coordinates.map(c => [c[1], c[0]]), { color: '#00b4ff', weight: 6, opacity: .9 }).addTo(routeLayer);
      const ni = $('nextInfo'); if (ni) ni.textContent = `الطريق: ${(rt.distance / 1000).toFixed(1)} كم · حوالي ${Math.max(1, Math.round(rt.duration / 60))} د`;
    } catch (e) {}
  }

  // ----- ركب ✓ / نزل ✓ -----
  app.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-done]'); if (!b) return;
    const i = +b.dataset.done;
    if (done[i]) { delete done[i]; fb('DELETE', k, 'done/' + i).catch(() => {}); }
    else { done[i] = Date.now(); fb('PUT', k, 'done/' + i, SV).catch(() => {}); try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} }
    ls.set('trk_plan_' + k, { plan, done }); routeFor = null; drawPlan();
  });

  // ----- إرسال المكان -----
  function point(st) {
    const f = lastFix;
    return { lat: +f.lat.toFixed(6), lng: +f.lng.toFixed(6), acc: Math.round(f.acc || 0), spd: f.spd != null ? +f.spd.toFixed(1) : null, hdg: f.hdg != null ? Math.round(f.hdg) : null, t: f.t, st: st || 'on', bat: battery ? Math.round(battery.level * 100) : null, chg: battery ? battery.charging : null };
  }
  let sending = false;
  async function flush(st, keepalive) {
    if (!lastFix || sending) return;
    sending = true;
    const p = point(st), body = { pos: Object.assign({}, p, { srv: SV }) };
    // كل النقط اللي اتجمعت (لو النت كان قاطع) بتتبعت في طلب واحد
    queue.forEach(q => { body['trail/' + q.t] = q; });
    try {
      await fetch(fbUrl(k, ''), { method: 'PATCH', body: JSON.stringify(body), keepalive: !!keepalive, headers: { 'Content-Type': 'application/json' } }).then(r => { if (!r.ok) throw new Error(r.status); });
      queue = []; ls.set(Q_KEY, queue); lastOkAt = Date.now();
    } catch (e) { /* النت قاطع: النقط فاضلة في الطابور وهتتبعت بعدين */ }
    sending = false; drawStats();
  }
  function tick() {
    if (!running) return;
    const now = Date.now();
    // GPS واقف؟
    if (lastFixAt && now - lastFixAt > GPS_STALE && document.visibilityState === 'visible') {
      showB('bErr', `🔴 الـ GPS ما بعتش مكان من ${fmtAge(now - lastFixAt)} — اتأكد إن الموقع (Location) مفتوح في الموبايل.`);
      if (now - staleWarnAt > 60000) { staleWarnAt = now; beep(3); }
    }
    if (!lastFix) return;
    const moved = lastSent ? distM(lastSent, lastFix) : Infinity;
    if (now - lastSentAt >= SEND_EVERY || (moved >= SEND_MOVE && now - lastSentAt >= 3000)) {
      lastSent = { lat: lastFix.lat, lng: lastFix.lng }; lastSentAt = now;
      queue.push({ lat: +lastFix.lat.toFixed(6), lng: +lastFix.lng.toFixed(6), t: lastFix.t });
      if (queue.length > Q_MAX) queue = queue.slice(-Q_MAX);
      ls.set(Q_KEY, queue);
      flush('on');
    }
    drawStats();
  }
  function drawStats() {
    if (!running) return;
    const now = Date.now(), f = lastFix;
    const net = navigator.onLine && lastOkAt && now - lastOkAt < 40000;
    $('hdot').style.background = !f ? '#888' : net ? '#2ecc71' : '#f1c40f';
    $('stats').innerHTML = `
      <div class="stat">📡 الإرسال<b>${net ? '🟢 شغال' : navigator.onLine ? '🟡 بيحاول' : '📵 مفيش نت'}</b></div>
      <div class="stat">🕒 آخر إرسال<b>${lastOkAt ? 'من ' + fmtAge(now - lastOkAt) : '—'}</b></div>
      <div class="stat">🛰️ دقة المكان<b>${f ? (f.acc > 100 ? '⚠️ ' : '') + Math.round(f.acc) + ' متر' : 'بيدوّر...'}</b></div>
      <div class="stat">🚗 السرعة<b>${f && f.spd != null ? Math.round(f.spd * 3.6) + ' كم/س' : '—'}</b></div>
      <div class="stat">📦 مستني يتبعت<b>${queue.length ? queue.length + ' نقطة' : 'مفيش'}</b></div>
      <div class="stat">🔋 البطارية<b>${battery ? Math.round(battery.level * 100) + '%' + (battery.charging ? ' ⚡' : ' — حط الشاحن!') : '—'}</b></div>
      <div class="stat" style="grid-column:1/-1">💡 الشاشة<b>${wake ? '🟢 مش هتقفل لوحدها' : '⚠️ ممكن تقفل — المس الشاشة كل شوية'}</b></div>`;
    if (!navigator.onLine) showB('bWarn', `📵 مفيش نت — المكان بيتحفظ على الموبايل (${queue.length} نقطة) وهيتبعت أول ما النت يرجع.`);
    else if ($('bWarn').classList.contains('show') && /نت/.test($('bWarn').textContent)) showB('bWarn', '');
  }

  // ----- GPS -----
  function onFix(p) {
    const c = p.coords;
    lastFix = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, spd: c.speed, hdg: c.heading, t: p.timestamp || Date.now() };
    lastFixAt = Date.now();
    if ($('bErr').classList.contains('show') && /GPS|الموقع/.test($('bErr').textContent)) showB('bErr', '');
    const ll = [lastFix.lat, lastFix.lng];
    if (!busMk) { busMk = L.marker(ll, { icon: busIcon(false), zIndexOffset: 1000 }).addTo(map); map.setView(ll, 16); }
    else busMk.setLatLng(ll);
    if (follow) map.panTo(ll, { animate: true });
    drawNext();
    tick();
  }
  function onGpsErr(e) {
    if (e.code === 1) showB('bErr', '🔴 الموبايل رافض يدّي الصفحة المكان.<br>افتح ⋮ فوق ← <b>الإعدادات</b> ← <b>إعدادات المواقع</b> ← <b>الموقع</b> واسمح للصفحة دي، وبعدين اقفل الصفحة وافتحها تاني.');
    else if (e.code === 2) showB('bErr', '🔴 مش لاقي إشارة GPS — اتأكد إن الموقع (Location) مفتوح من فوق في الموبايل.');
  }

  // ----- الشاشة متقفلش -----
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; drawStats(); }); } } catch (e) { wake = null; }
    drawStats();
  }

  // ----- إشعار يرجّع السواق للصفحة -----
  async function setupSW() {
    try { if ('serviceWorker' in navigator) swReg = await navigator.serviceWorker.register('sw.js'); } catch (e) { swReg = null; }
  }
  async function askNotify() { try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {} }
  function notifyBack() {
    try { if (swReg && Notification.permission === 'granted') swReg.showNotification('🚐 المتابعة واقفة', { body: 'دوس هنا وارجع لصفحة المتابعة', tag: 'trk-back', renotify: true, requireInteraction: true, vibrate: [300, 100, 300], data: { url: location.href } }); } catch (e) {}
  }
  async function clearNotify() { try { if (swReg) (await swReg.getNotifications({ tag: 'trk-back' })).forEach(n => n.close()); } catch (e) {} }

  document.addEventListener('visibilitychange', () => {
    if (!running) return;
    if (document.visibilityState === 'hidden') {
      // قبل ما الصفحة تروح للخلفية: نقول لصفحتك إن المتابعة متوقفة مؤقتًا، ونطلّع إشعار
      if (lastFix) flush('pause', true);
      notifyBack();
    } else {
      clearNotify(); keepAwake();
      lastSentAt = 0; tick(); // نبعت على طول
      try { navigator.geolocation.getCurrentPosition(onFix, () => {}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }); } catch (e) {}
    }
  });
  window.addEventListener('online', () => { if (running) flush('on'); });
  window.addEventListener('offline', drawStats);

  // ----- ابدأ / خلّص -----
  async function start(auto) {
    if (!('geolocation' in navigator)) { showB('bErr', '🔴 الموبايل ده مش بيدعم تحديد المكان.'); return; }
    running = true; ls.set(RUN_KEY, { on: true, at: ls.get(RUN_KEY, {}).at || Date.now() });
    $('bStart').classList.add('hide'); $('bEnd').classList.remove('hide'); $('cStat').classList.remove('hide');
    if (!auto) await askNotify();
    keepAwake();
    watchId = navigator.geolocation.watchPosition(onFix, onGpsErr, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
    lastFixAt = Date.now(); // نبدأ نعدّ من دلوقتي
    drawPlan(); drawStats();
    if (auto) showB('bWarn', '▶️ المتابعة رجعت تشتغل لوحدها.'), setTimeout(() => { if (/رجعت/.test($('bWarn').textContent)) showB('bWarn', ''); }, 5000);
  }
  async function end() {
    if (!(await confirmDlg('خلصت الرحلة؟', 'المتابعة هتقف وصفحة المتابعة هتعرف إن الرحلة خلصت.', '⏹️ أيوه خلصت'))) return;
    if (lastFix) await flush('off');
    else { try { await fb('PATCH', k, 'pos', { st: 'off', srv: SV }); } catch (e) {} }
    running = false; ls.del(RUN_KEY);
    if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null;
    try { wake && wake.release(); } catch (e) {} wake = null;
    $('bStart').classList.remove('hide'); $('bEnd').classList.add('hide'); $('cStat').classList.add('hide'); $('cNext').classList.add('hide');
    $('hdot').style.background = '#888'; showB('bErr', ''); showB('bWarn', '');
    showB('bWarn', '✅ الرحلة خلصت. شكرًا!');
  }
  $('bStart').onclick = () => start(false);
  $('bEnd').onclick = end;

  try { navigator.getBattery && navigator.getBattery().then(b => { battery = b; b.onlevelchange = b.onchargingchange = drawStats; drawStats(); }); } catch (e) {}
  setupSW();
  loadPlan();
  setInterval(tick, 5000);
  setInterval(() => { if (running) drawRoute(); }, 30000);
  // لو الرحلة كانت شغالة والصفحة اتقفلت واتفتحت تاني: تكمّل لوحدها
  if (ls.get(RUN_KEY, null)) start(true);
}

// نافذة تأكيد بسيطة
function confirmDlg(title, body, okTxt) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'dlg';
    d.innerHTML = `<div class="card"><div style="font-size:18px;font-weight:800;margin-bottom:6px">${esc(title)}</div><div class="muted">${esc(body)}</div>
      <div class="row" style="margin-top:12px"><button class="btn err grow" data-v="1">${esc(okTxt)}</button><button class="btn grow" data-v="0">رجوع</button></div></div>`;
    d.onclick = e => { const b = e.target.closest('[data-v]'); if (!b && e.target !== d) return; d.remove(); res(!!(b && b.dataset.v === '1')); };
    document.body.appendChild(d);
  });
}

// =====================================================================
// وضع المتابعة التجريبي (#view=المفتاح) — في المرحلة ٣ ده هيبقى جوه صفحتك في خطوة ٤
// =====================================================================
function viewMode(k) {
  app.innerHTML = `
    <div class="banner err" id="vErr"></div>
    <div class="card"><div style="font-size:18px;font-weight:800" id="vTitle">👀 متابعة العربية</div><div class="muted" id="vSub">⏳ بتوصل...</div></div>
    <div id="vmap"></div>
    <div class="card"><div class="stats" id="vStats"></div></div>
    <div class="row"><button class="btn grow" id="vFit">🔍 وريني العربية</button><button class="btn grow" id="vTrail">🧵 خط السير: ظاهر</button></div>
    <div class="muted" style="text-align:center">صفحة متابعة تجريبية — نسخة 1.0</div>`;
  const map = makeMap($('vmap'));
  const trailL = L.polyline([], { color: '#ffd400', weight: 4, opacity: .9 }).addTo(map);
  let busMk = null, data = {}, fitted = false, showTrail = true, lastAlert = 0;

  // نطبّق التحديث اللي جاي من Firebase على نسختنا من البيانات
  function apply(path, val) {
    const parts = path.split('/').filter(Boolean);
    if (!parts.length) { data = val || {}; return; }
    let o = data; for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
    const last = parts[parts.length - 1]; if (val === null) delete o[last]; else o[last] = val;
  }
  function draw() {
    const p = data.pos, plan = data.plan, now = Date.now();
    $('vTitle').textContent = '👀 ' + (plan && plan.line ? plan.line : 'متابعة العربية');
    const pts = Object.values(data.trail || {}).filter(x => x && x.lat).sort((a, b) => a.t - b.t).map(x => [x.lat, x.lng]);
    trailL.setLatLngs(showTrail ? pts : []);
    if (!p || !p.lat) { $('vSub').textContent = '⏳ لسه العربية ما بعتتش مكانها — السواق لازم يدوس "ابدأ الرحلة".'; drawStats(); return; }
    const age = now - (p.srv || p.t || now);
    const stale = p.st === 'on' && age > 45000, paused = p.st === 'pause', off = p.st === 'off';
    const ll = [p.lat, p.lng];
    if (!busMk) busMk = L.marker(ll, { icon: busIcon(false), zIndexOffset: 1000 }).addTo(map); else busMk.setLatLng(ll);
    busMk.setIcon(busIcon(stale || paused || off));
    busMk.bindTooltip(off ? 'خلصت الرحلة' : stale || paused ? 'آخر مكان معروف' : 'دلوقتي');
    if (!fitted) { fitted = true; map.setView(ll, 15); }
    $('vSub').innerHTML = off ? '⚫ <b>الرحلة خلصت</b>' : paused ? `⏸️ <b>متوقفة مؤقتًا</b> من ${fmtAge(age)} — غالبًا السواق في مكالمة أو فتح أبلكيشن تاني. اللي على الخريطة آخر مكان معروف.`
      : stale ? `🔴 <b>مفيش تحديث</b> من ${fmtAge(age)} — ممكن النت قاطع عنده. اللي على الخريطة آخر مكان معروف.` : `🟢 <b>شغالة</b> — آخر تحديث من ${fmtAge(age)}`;
    $('hdot').style.background = off ? '#888' : paused ? '#f39c12' : stale ? '#e74c3c' : '#2ecc71';
    // تنبيه لو الوقفة طولت أكتر من ٥ دقايق
    if ((paused || stale) && age > 5 * 60000 && now - lastAlert > 5 * 60000) { lastAlert = now; beep(3); $('vErr').innerHTML = `⚠️ العربية بقالها ${fmtAge(age)} من غير تحديث — كلّم السواق.`; $('vErr').classList.add('show'); }
    else if (!(paused || stale)) $('vErr').classList.remove('show');
    drawStats();
  }
  function drawStats() {
    const p = data.pos || {}, done = Object.keys(data.done || {}).length, n = data.plan && data.plan.stops ? data.plan.stops.length : 0;
    $('vStats').innerHTML = `
      <div class="stat">🚗 السرعة<b>${p.spd != null ? Math.round(p.spd * 3.6) + ' كم/س' : '—'}</b></div>
      <div class="stat">🛰️ دقة المكان<b>${p.acc ? Math.round(p.acc) + ' متر' : '—'}</b></div>
      <div class="stat">🔋 بطارية السواق<b>${p.bat != null ? p.bat + '%' + (p.chg ? ' ⚡' : '') : '—'}</b></div>
      <div class="stat">🕒 آخر مكان<b>${p.t ? fmtTime(p.t) : '—'}</b></div>
      ${n ? `<div class="stat" style="grid-column:1/-1">👥 الركاب<b>${done} من ${n} ${data.plan.mode === 'pm' ? 'نزلوا' : 'ركبوا'}</b></div>` : ''}`;
  }
  $('vFit').onclick = () => { if (data.pos && data.pos.lat) map.setView([data.pos.lat, data.pos.lng], 16); };
  $('vTrail').onclick = () => { showTrail = !showTrail; $('vTrail').textContent = '🧵 خط السير: ' + (showTrail ? 'ظاهر' : 'مخفي'); draw(); };

  // اتصال مفتوح مع Firebase: أي تحديث بيوصل في نفس اللحظة
  let es = null;
  function connect() {
    try { es && es.close(); } catch (e) {}
    es = new EventSource(fbUrl(k, ''));
    const on = ev => { try { const d = JSON.parse(ev.data); if (ev.type === 'put') apply(d.path, d.data); else Object.keys(d.data || {}).forEach(c => apply(d.path.replace(/\/$/, '') + '/' + c, d.data[c])); draw(); } catch (e) {} };
    es.addEventListener('put', on); es.addEventListener('patch', on);
    es.addEventListener('cancel', () => { $('vErr').innerHTML = '🔴 Firebase رفض — اتأكد من قواعد الحماية (Rules).'; $('vErr').classList.add('show'); });
    es.onerror = () => { $('vSub').textContent = '📵 الاتصال اتقطع — بحاول تاني...'; };
  }
  connect();
  setInterval(draw, 1000); // علشان "من كام ثانية" يفضل متحدّث
}

// =====================================================================
// وضع التجربة (من غير مفتاح): بيعمل مفتاح جديد ويديك لينك السواق ولينك المتابعة
// =====================================================================
function testMode() {
  const base = location.href.split('#')[0];
  app.innerHTML = `
    <div class="card">
      <div style="font-size:18px;font-weight:800">🧪 تجربة المتابعة</div>
      <div class="muted">الزرار ده بيعمل مفتاح سري جديد لتجربة واحدة، ويديك لينكين:<br>
      ١. <b>لينك السواق</b>: افتحه على الموبايل اللي هيتحرك.<br>
      ٢. <b>لينك المتابعة</b>: افتحه على موبايل تاني أو على الكمبيوتر وتابع منه.</div>
      <button class="btn big pri" id="tNew" style="margin-top:10px">🔑 اعمل تجربة جديدة</button>
    </div>
    <div class="card hide" id="tOut"></div>
    <div class="banner err" id="tErr"></div>`;
  $('tNew').onclick = async () => {
    const k = newKey();
    $('tNew').disabled = true; $('tNew').textContent = '⏳ بجرّب Firebase...';
    try { await fb('PUT', k, 'plan', { line: 'خط تجربة', color: '#0f6fd8', mode: 'am', stops: [], at: SV }); }
    catch (e) { $('tErr').innerHTML = '🔴 مش قادر أكتب في Firebase (' + esc(e.message) + ').<br>اتأكد إن فيه نت، وإن قواعد الحماية (Rules) اتعملها Publish.'; $('tErr').classList.add('show'); $('tNew').disabled = false; $('tNew').textContent = '🔑 اعمل تجربة جديدة'; return; }
    const dl = base + '#k=' + k, vl = base + '#view=' + k;
    $('tNew').disabled = false; $('tNew').textContent = '🔑 اعمل تجربة جديدة';
    $('tOut').classList.remove('hide');
    $('tOut').innerHTML = `<div class="banner ok show">✅ Firebase شغال والمفتاح اتعمل.</div>
      <b style="display:block;margin-top:10px">١. لينك السواق</b><input class="link" readonly value="${esc(dl)}">
      <div class="row" style="margin-top:6px"><a class="btn sm pri" href="${esc(dl)}">افتحه هنا</a><a class="btn sm" href="https://wa.me/?text=${encodeURIComponent('لينك متابعة العربية: ' + dl)}" target="_blank">ابعته واتساب</a><button class="btn sm" data-copy="${esc(dl)}">انسخ</button></div>
      <b style="display:block;margin-top:12px">٢. لينك المتابعة</b><input class="link" readonly value="${esc(vl)}">
      <div class="row" style="margin-top:6px"><a class="btn sm pri" href="${esc(vl)}">افتحه هنا</a><a class="btn sm" href="https://wa.me/?text=${encodeURIComponent('لينك متابعة العربية (للمشرف): ' + vl)}" target="_blank">ابعته واتساب</a><button class="btn sm" data-copy="${esc(vl)}">انسخ</button></div>
      <div class="muted" style="margin-top:8px">⚠️ اللي معاه أي لينك من دول يقدر يشوف التجربة دي، فما تبعتهمش لحد غيرك.</div>`;
  };
  app.addEventListener('click', ev => { const b = ev.target.closest('[data-copy]'); if (!b) return; navigator.clipboard.writeText(b.dataset.copy).then(() => { b.textContent = 'اتنسخ ✓'; }, () => {}); });
}

// ---------- أنهي وضع؟ ----------
function route() {
  const k = hashArg('k'), v = hashArg('view');
  if (k && k.length >= 24) driverMode(k);
  else if (v && v.length >= 24) viewMode(v);
  else testMode();
}
window.addEventListener('hashchange', () => location.reload());
route();
</script>
</body>
